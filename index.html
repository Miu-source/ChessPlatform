<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Platform</title>

    <style>
/* =================================
   CHESS PLATFORM — DESIGN SYSTEM
================================= */

:root {
    --background: #171917;
    --sidebar: #1d201d;
    --surface: #222622;
    --surface-hover: #292e29;
    --border: #343a34;

    --accent: #81a66a;
    --accent-hover: #94b77e;
    --accent-dark: #354832;

    --text: #e7e9e5;
    --text-secondary: #a0a79d;
    --text-muted: #747d71;

    --danger: #c87878;

    --radius: 8px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--background);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =================================
   AUTHENTICATION
================================= */

.auth-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.auth-container > h1 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 2px;
}

.subtitle {
    color: var(--text-secondary);
    margin: 8px 0 28px;
}

.auth-box {
    width: 100%;
    max-width: 390px;
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}

.auth-box h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
}

input {
    width: 100%;
    padding: 12px 13px;
    margin-bottom: 12px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
}

input:focus {
    border-color: var(--accent);
}

input::placeholder {
    color: var(--text-muted);
}

.auth-box button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #171b15;
    border: none;
    border-radius: 5px;
    font-weight: 600;
    transition: background 0.15s;
}

.auth-box button:hover {
    background: var(--accent-hover);
}

.separator {
    height: 1px;
    background: var(--border);
    margin: 25px 0;
}

#message {
    color: var(--accent-hover);
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.5;
}

/* =================================
   DASHBOARD LAYOUT
================================= */

.dashboard-layout {
    display: flex;
    min-height: 100vh;
}

/* =================================
   SIDEBAR
================================= */

.sidebar {
    width: 245px;
    min-height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 25px 16px 18px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 2px 10px 34px;
}

.brand-icon {
    font-size: 29px;
    color: var(--accent);
}

.brand h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.2px;
}

.nav-label {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 0 12px;
    margin-bottom: 10px;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.nav-button {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--text-secondary);
    text-align: left;
    font-size: 13px;
    transition: 0.15s;
}

.nav-button span {
    display: inline-block;
    width: 27px;
    font-size: 17px;
}

.nav-button:hover {
    background: var(--surface-hover);
    color: var(--text);
}

.nav-button.active {
    background: var(--accent-dark);
    color: #b7d3a5;
    border-color: #465a40;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 20px;
}

.sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 5px;
    border-top: 1px solid var(--border);
}

.avatar {
    width: 35px;
    height: 35px;
    border-radius: 5px;
    background: var(--accent-dark);
    color: #c5dfb6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    flex-shrink: 0;
}

.sidebar-user-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}

.sidebar-user-info strong {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-user-info span {
    color: var(--text-muted);
    font-size: 11px;
}

.logout-button {
    width: 100%;
    padding: 9px 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-secondary);
    font-size: 12px;
    text-align: left;
}

.logout-button:hover {
    background: var(--surface-hover);
    color: var(--text);
}

/* =================================
   MAIN CONTENT
================================= */

.main-content {
    flex: 1;
    min-width: 0;
}

.topbar {
    min-height: 86px;
    padding: 18px 35px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.topbar-label {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
}

.topbar h1 {
    font-size: 21px;
    font-weight: 600;
}

.topbar-user {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--text-secondary);
    font-size: 12px;
}

.page-content {
    width: 100%;
    max-width: 1250px;
    padding: 30px 35px;
}

/* =================================
   HOME PAGE
================================= */

.welcome-banner {
    min-height: 155px;
    padding: 28px 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.eyebrow {
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 9px;
}

.welcome-banner h2 {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 7px;
}

.welcome-banner p:last-child {
    color: var(--text-secondary);
    font-size: 13px;
}

.banner-piece {
    font-size: 75px;
    color: var(--accent);
    opacity: 0.65;
    padding-right: 15px;
}

.section-heading {
    font-size: 15px;
    font-weight: 600;
    margin: 30px 0 14px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 17px 18px;
}

.stat-icon {
    color: var(--accent);
    font-size: 19px;
}

.stat-card p {
    color: var(--text-secondary);
    font-size: 12px;
    margin: 9px 0 5px;
}

.stat-card h3 {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
}

.quick-access-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.quick-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 19px;
    text-align: left;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s;
}

.quick-card:hover {
    background: var(--surface-hover);
    border-color: #53644c;
}

.quick-card span {
    font-size: 22px;
    color: var(--accent);
}

.quick-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 10px 0 4px;
}

.quick-card p {
    color: var(--text-secondary);
    font-size: 12px;
}

/* =================================
   PLACEHOLDER PAGES
================================= */

.placeholder-card {
    max-width: 750px;
    margin: 25px auto;
    padding: 55px 25px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    text-align: center;
}

.placeholder-icon {
    color: var(--accent);
    font-size: 43px;
    margin-bottom: 15px;
}

.placeholder-card h2 {
    font-size: 20px;
    margin-bottom: 9px;
}

.placeholder-card p {
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-size: 13px;
}

.placeholder-card .coming-soon {
    color: var(--accent);
    font-size: 12px;
    margin-top: 20px;
}

.settings-logout {
    margin-top: 22px;
    padding: 10px 20px;
    background: var(--accent);
    border: none;
    border-radius: 5px;
    color: #171b15;
    font-weight: 600;
}

/* =================================
   PROFILE PAGE
================================= */

.profile-page-card {
    max-width: 650px;
    margin: 20px auto;
    padding: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    text-align: center;
}

.large-avatar {
    width: 72px;
    height: 72px;
    margin: 0 auto 15px;
    background: var(--accent-dark);
    border-radius: 6px;
    color: #c5dfb6;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 29px;
    font-weight: 700;
}

.profile-page-card > h2 {
    font-size: 21px;
    font-weight: 600;
}

.profile-subtitle {
    color: var(--text-secondary);
    margin-top: 5px;
    font-size: 12px;
}

.profile-rating {
    margin: 28px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.profile-rating span {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
}

.profile-rating strong {
    font-size: 39px;
    color: var(--accent);
    font-weight: 600;
}

.profile-page-card .stats-grid {
    grid-template-columns: repeat(3, 1fr);
    text-align: left;
}

/* =================================
   PROFILE EDITING
================================= */

.edit-card {
    max-width: 650px;
    margin: 20px auto;
    padding: 26px 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
}

.edit-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
}

.edit-hint {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 16px;
}

.edit-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.primary-button,
.secondary-button {
    padding: 10px 18px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
}

.primary-button {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #171b15;
}

.primary-button:hover:not(:disabled) {
    background: var(--accent-hover);
}

.secondary-button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
}

.secondary-button:hover:not(:disabled) {
    background: var(--surface-hover);
    color: var(--text);
}

.primary-button:disabled,
.secondary-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.form-message {
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
}

.form-message.success {
    color: var(--accent-hover);
}

.form-message.error {
    color: var(--danger);
}

/* =================================
   ERROR SCREEN
================================= */

.error-screen {
    text-align: center;
    padding: 100px 20px;
}

.error-screen p {
    color: var(--text-secondary);
    margin: 15px 0;
}

.error-screen button {
    padding: 10px 20px;
    background: var(--accent);
    border: none;
    border-radius: 5px;
    color: #171b15;
}

/* =================================
   RESPONSIVE DESIGN
================================= */

@media (max-width: 900px) {
    .sidebar {
        width: 210px;
    }

    .page-content {
        padding: 25px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    .dashboard-layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        min-height: auto;
        padding: 12px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    .brand {
        padding: 5px 8px 12px;
    }

    .sidebar nav {
        flex-direction: row;
        overflow-x: auto;
        gap: 4px;
    }

    .nav-label,
    .sidebar-bottom {
        display: none;
    }

    .nav-button {
        white-space: nowrap;
        width: auto;
        padding: 9px;
        font-size: 11px;
    }

    .nav-button span {
        width: auto;
        margin-right: 4px;
    }

    .topbar {
        min-height: 70px;
        padding: 15px 18px;
    }

    .topbar h1 {
        font-size: 18px;
    }

    .topbar-user {
        font-size: 11px;
    }

    .page-content {
        padding: 18px;
    }

    .welcome-banner {
        padding: 22px;
    }

    .welcome-banner h2 {
        font-size: 18px;
    }

    .banner-piece {
        font-size: 55px;
        padding-right: 0;
    }

    .stats-grid {
        gap: 9px;
    }

    .stat-card {
        padding: 14px;
    }

    .quick-access-grid {
        grid-template-columns: 1fr;
    }

    .edit-card {
        padding: 20px;
    }

    .edit-actions button {
        flex: 1;
    }
}

@media (max-width: 380px) {
    .nav-button {
        font-size: 10px;
        padding: 8px;
    }

    .nav-button span {
        display: none;
    }
}
    </style>
</head>
<body>
    <div id="app">
        <p>Loading Chess Platform...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
const SUPABASE_URL = "https://dugpxbplbjuigufgwobs.supabase.co";
const SUPABASE_KEY = "sb_publishable_lB-IrfUqpAPU9R7hqS49-A_NI8zIOws";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let currentSection = "Home";

async function checkUser() {
    const { data, error } = await db.auth.getUser();

    if (error) {
        console.error(error);
    }

    currentUser = data?.user || null;

    if (currentUser) {
        await showDashboard();
    } else {
        showAuth();
    }
}

function showAuth() {
    document.getElementById("app").innerHTML = `
        <div class="auth-container">
            <h1>CHESS PLATFORM</h1>
            <p class="subtitle">Play. Improve. Compete.</p>

            <div class="auth-box">
                <h2>Create Account</h2>

                <input id="username" placeholder="Username" maxlength="20">
                <input id="email" type="email" placeholder="Email">
                <input id="password" type="password" placeholder="Password">

                <button onclick="register()">Create Account</button>

                <div class="separator"></div>

                <h2>Welcome Back</h2>

                <input id="loginEmail" type="email" placeholder="Email">
                <input id="loginPassword" type="password" placeholder="Password">

                <button onclick="login()">Login</button>

                <p id="message"></p>
            </div>
        </div>
    `;
}

async function register() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showMessage("Username must be 3-20 characters, using letters, numbers or underscores.");
        return;
    }

    if (!email || password.length < 8) {
        showMessage("Enter a valid email and a password of at least 8 characters.");
        return;
    }

    showMessage("Creating account...");

    const { data, error } = await db.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                username: username
            }
        }
    });

    if (error) {
        showMessage(error.message);
        return;
    }

    if (data.session) {
        currentUser = data.user;
        await showDashboard();
    } else {
        showMessage("Account created! Check your email to confirm your account.");
    }
}

async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
        showMessage("Enter your email and password.");
        return;
    }

    showMessage("Logging in...");

    const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showMessage(error.message);
        return;
    }

    currentUser = data.user;
    await showDashboard();
}

async function logout() {
    const { error } = await db.auth.signOut();

    if (error) {
        showMessage(error.message);
        return;
    }

    currentUser = null;
    currentProfile = null;
    showAuth();
}

function showMessage(message) {
    const element = document.getElementById("message");

    if (element) {
        element.textContent = message;
    }
}

async function showDashboard() {
    const { data, error } = await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

    if (error) {
        console.error(error);

        document.getElementById("app").innerHTML = `
            <div class="error-screen">
                <h1>Welcome!</h1>
                <p>We couldn't load your profile.</p>
                <button onclick="logout()">Logout</button>
            </div>
        `;

        return;
    }

    currentProfile = data;
    currentSection = "Home";
    renderDashboard();
}

function renderDashboard() {
    const username = escapeHTML(currentProfile.username);

    document.getElementById("app").innerHTML = `
        <div class="dashboard-layout">

            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-icon">♞</div>
                    <h2>CHESS PLATFORM</h2>
                </div>

                <div class="nav-label">MENU</div>

                <nav>
                    <button class="nav-button ${currentSection === "Home" ? "active" : ""}"
                        onclick="navigateTo('Home')">
                        <span>⌂</span> Home
                    </button>

                    <button class="nav-button ${currentSection === "Play" ? "active" : ""}"
                        onclick="navigateTo('Play')">
                        <span>♟</span> Play
                    </button>

                    <button class="nav-button ${currentSection === "Leaderboards" ? "active" : ""}"
                        onclick="navigateTo('Leaderboards')">
                        <span>♜</span> Leaderboards
                    </button>

                    <button class="nav-button ${currentSection === "Profile" ? "active" : ""}"
                        onclick="navigateTo('Profile')">
                        <span>♙</span> Profile
                    </button>

                    <button class="nav-button ${currentSection === "Settings" ? "active" : ""}"
                        onclick="navigateTo('Settings')">
                        <span>⚙</span> Settings
                    </button>
                </nav>

                <div class="sidebar-bottom">
                    <div class="sidebar-user">
                        <div class="avatar">${username.charAt(0).toUpperCase()}</div>
                        <div class="sidebar-user-info">
                            <strong>${username}</strong>
                            <span>${currentProfile.rating} Rating</span>
                        </div>
                    </div>

                    <button class="logout-button" onclick="logout()">
                        Log Out
                    </button>
                </div>
            </aside>

            <main class="main-content">
                <header class="topbar">
                    <div>
                        <p class="topbar-label">CHESS PLATFORM</p>
                        <h1>${currentSection}</h1>
                    </div>

                    <div class="topbar-user">
                        <span>${username}</span>
                        <div class="avatar">${username.charAt(0).toUpperCase()}</div>
                    </div>
                </header>

                <section class="page-content">
                    ${getSectionContent()}
                </section>
            </main>

        </div>
    `;
}

function navigateTo(section) {
    currentSection = section;
    renderDashboard();
}

function getSectionContent() {
    const username = escapeHTML(currentProfile.username);

    if (currentSection === "Home") {
        return `
            <div class="welcome-banner">
                <div>
                    <p class="eyebrow">WELCOME BACK</p>
                    <h2>Ready to make your next move, ${username}?</h2>
                    <p>Your chess journey continues here.</p>
                </div>
                <div class="banner-piece">♞</div>
            </div>

            <h2 class="section-heading">Your Overview</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon">♟</span>
                    <p>Your Rating</p>
                    <h3>${currentProfile.rating}</h3>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">🏆</span>
                    <p>Wins</p>
                    <h3>${currentProfile.wins}</h3>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">⚔</span>
                    <p>Losses</p>
                    <h3>${currentProfile.losses}</h3>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">🤝</span>
                    <p>Draws</p>
                    <h3>${currentProfile.draws}</h3>
                </div>
            </div>

            <h2 class="section-heading">Quick Access</h2>

            <div class="quick-access-grid">
                <button class="quick-card" onclick="navigateTo('Play')">
                    <span>♟</span>
                    <h3>Play Chess</h3>
                    <p>Start your next game.</p>
                </button>

                <button class="quick-card" onclick="navigateTo('Leaderboards')">
                    <span>🏆</span>
                    <h3>Leaderboards</h3>
                    <p>See how players rank.</p>
                </button>
            </div>
        `;
    }

    if (currentSection === "Play") {
        return `
            <div class="placeholder-card">
                <div class="placeholder-icon">♟</div>
                <h2>Play Chess</h2>
                <p>Choose how you want to play.</p>
                <p class="coming-soon">Game modes are coming soon.</p>
            </div>
        `;
    }

    if (currentSection === "Leaderboards") {
        return `
            <div class="placeholder-card">
                <div class="placeholder-icon">🏆</div>
                <h2>Leaderboards</h2>
                <p>Discover the top-rated players.</p>
                <p class="coming-soon">Leaderboards are coming soon.</p>
            </div>
        `;
    }

    if (currentSection === "Profile") {
        return `
            <div class="profile-page-card">
                <div class="large-avatar">${username.charAt(0).toUpperCase()}</div>
                <h2>${username}</h2>
                <p class="profile-subtitle">Chess Platform Player</p>

                <div class="profile-rating">
                    <span>RATING</span>
                    <strong>${currentProfile.rating}</strong>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <p>Wins</p>
                        <h3>${currentProfile.wins}</h3>
                    </div>
                    <div class="stat-card">
                        <p>Losses</p>
                        <h3>${currentProfile.losses}</h3>
                    </div>
                    <div class="stat-card">
                        <p>Draws</p>
                        <h3>${currentProfile.draws}</h3>
                    </div>
                </div>
            </div>

            <div class="edit-card">
                <h3>Edit Username</h3>
                <p class="edit-hint">3–20 characters. Letters, numbers and underscores only.</p>

                <input id="newUsername" value="${username}" maxlength="20"
                    placeholder="New username" autocomplete="off">

                <div class="edit-actions">
                    <button id="checkUsernameBtn" class="secondary-button"
                        onclick="handleCheckUsername()">Check Availability</button>
                    <button id="saveUsernameBtn" class="primary-button"
                        onclick="saveUsername()">Save Changes</button>
                </div>

                <p id="profileMessage" class="form-message"></p>
            </div>
        `;
    }

    if (currentSection === "Settings") {
        return `
            <div class="placeholder-card">
                <div class="placeholder-icon">⚙</div>
                <h2>Settings</h2>
                <p>Manage your account and preferences.</p>
                <p class="coming-soon">Settings are coming soon.</p>

                <button class="settings-logout" onclick="logout()">Log Out</button>
            </div>
        `;
    }

    return "";
}

/* =================================
   PROFILE EDITING
================================= */

function setProfileMessage(text, type) {
    const element = document.getElementById("profileMessage");

    if (!element) return;

    element.textContent = text;
    element.className = "form-message" + (type ? " " + type : "");
}

function validateUsername(name) {
    if (name.length < 3 || name.length > 20) {
        return "Username must be between 3 and 20 characters.";
    }

    if (!/^[a-zA-Z0-9_]+$/.test(name)) {
        return "Use only letters, numbers and underscores.";
    }

    return null;
}

// Returns true (free), false (taken) or null (could not check).
async function isUsernameAvailable(name) {
    // "_" is a wildcard in ilike, so we escape it to match literally.
    const pattern = name.replace(/\\/g, "\\\\").replace(/_/g, "\\_");

    const { data, error } = await db
        .from("profiles")
        .select("id")
        .ilike("username", pattern)
        .neq("id", currentUser.id)
        .limit(1);

    if (error) {
        console.error(error);
        return null;
    }

    return data.length === 0;
}

async function handleCheckUsername() {
    const name = document.getElementById("newUsername").value.trim();

    const problem = validateUsername(name);
    if (problem) {
        setProfileMessage(problem, "error");
        return;
    }

    if (name === currentProfile.username) {
        setProfileMessage("That is already your username.", "");
        return;
    }

    setProfileMessage("Checking availability...", "");

    const available = await isUsernameAvailable(name);

    if (available === null) {
        setProfileMessage("Couldn't check availability. Please try again.", "error");
    } else if (available) {
        setProfileMessage("\"" + name + "\" is available.", "success");
    } else {
        setProfileMessage("\"" + name + "\" is already taken.", "error");
    }
}

async function saveUsername() {
    const name = document.getElementById("newUsername").value.trim();

    const problem = validateUsername(name);
    if (problem) {
        setProfileMessage(problem, "error");
        return;
    }

    if (name === currentProfile.username) {
        setProfileMessage("That is already your username.", "");
        return;
    }

    const saveButton = document.getElementById("saveUsernameBtn");
    const checkButton = document.getElementById("checkUsernameBtn");
    saveButton.disabled = true;
    checkButton.disabled = true;

    setProfileMessage("Saving...", "");

    const available = await isUsernameAvailable(name);

    if (available === false) {
        setProfileMessage("\"" + name + "\" is already taken.", "error");
        saveButton.disabled = false;
        checkButton.disabled = false;
        return;
    }

    const { data, error } = await db
        .from("profiles")
        .update({ username: name })
        .eq("id", currentUser.id)
        .select()
        .single();

    if (error) {
        console.error(error);

        // 23505 = unique violation (someone took it a moment ago)
        if (error.code === "23505") {
            setProfileMessage("\"" + name + "\" is already taken.", "error");
        } else {
            setProfileMessage("Couldn't save your username. Please try again.", "error");
        }

        saveButton.disabled = false;
        checkButton.disabled = false;
        return;
    }

    currentProfile = data;
    renderDashboard();
    setProfileMessage("Username updated successfully.", "success");
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

db.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") {
        currentUser = null;
        currentProfile = null;
        showAuth();
    }
});

checkUser();
    </script>
